<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    /* =========================================================
    VINILO STORE
    Diseño Premium / Vinyl Record Shop
    ========================================================= */

    /* =========================================================
    VARIABLES
    ========================================================= */

    :root {

    --negro: #090909;
    --negro-2: #11110f;
    --negro-3: #191816;

    --crema: #f2eadc;
    --crema-2: #cfc5b4;

    --dorado: #c9a45c;
    --dorado-claro: #e2c37c;

    --vino: #731f2a;
    --vino-claro: #9d3542;

    --verde: #3d8b62;

    --gris: #89847a;

    --borde: rgba(255, 255, 255, 0.08);

    --sombra:
    0 25px 70px rgba(0, 0, 0, 0.55);

    }

    /* =========================================================
    RESET
    ========================================================= */

    {
    box-sizing: border-box;

    margin: 0;

    padding: 0;
    }

    html {
    scroll-behavior: smooth;
    }

    body {

    font-family:
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

    background:

    radial-gradient(
      circle at 50% -20%,
      rgba(201, 164, 92, 0.12),
      transparent 40%
    ),

    radial-gradient(
      circle at 10% 40%,
      rgba(115, 31, 42, 0.08),
      transparent 30%
    ),

    var(--negro);


    color: var(--crema);

    min-height: 100vh;

    padding: 0 25px 70px;

    overflow-x: hidden;
    }

    /* =========================================================
    TEXTURA DEL FONDO
    ========================================================= */

    body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.025;

    background-image:

    repeating-linear-gradient(
      0deg,
      #ffffff 0px,
      transparent 1px,
      transparent 4px
    );


    z-index: -1;
    }

    /* =========================================================
    HEADER / HERO
    ========================================================= */

    body::after {

    content: "VINYL";

    position: fixed;

    right: -120px;

    bottom: -100px;

    width: 380px;

    height: 380px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.025);

    box-shadow:

    0 0 0 20px rgba(255,255,255,0.01),
    0 0 0 40px rgba(255,255,255,0.01),
    0 0 0 60px rgba(255,255,255,0.01);


    display: flex;

    align-items: center;

    justify-content: center;

    color: rgba(255,255,255,0.02);

    font-size: 40px;

    font-weight: 900;

    letter-spacing: 10px;

    pointer-events: none;
    }

    /* =========================================================
    TITULO PRINCIPAL
    ========================================================= */

    h1 {

    padding-top: 75px;

    text-align: center;

    font-size:
    clamp(34px, 6vw, 68px);

    line-height: 1;

    font-weight: 900;

    letter-spacing: -2px;

    color: var(--crema);

    text-transform: uppercase;

    position: relative;
    }

    /* pequeño detalle dorado */

    h1::first-letter {

    color: var(--dorado);
    }

    /* =========================================================
    SLOGAN
    ========================================================= */

    .slogan {

    text-align: center;

    color: var(--crema-2);

    font-size: 17px;

    letter-spacing: 1px;

    margin-top: 18px;

    margin-bottom: 35px;
    }

    .slogan::after {

    content: "";

    display: block;

    width: 100px;

    height: 2px;

    margin: 22px auto 0;

    background:

    linear-gradient(
      90deg,
      transparent,
      var(--dorado),
      transparent
    );


    }

    /* =========================================================
    BENEFICIOS
    ========================================================= */

    .beneficios {

    width: 100%;

    max-width: 1200px;

    margin: 0 auto 55px;

    padding: 5px;

    display: flex;

    justify-content: center;

    gap: 6px;

    flex-wrap: wrap;

    background: #141311;

    border: 1px solid var(--borde);

    border-radius: 8px;

    box-shadow:

    0 15px 40px rgba(0,0,0,.35);


    }

    .beneficios span {

    flex: 1;

    min-width: 180px;

    padding: 14px 18px;

    text-align: center;

    color: #bcb5a8;

    font-size: 12px;

    font-weight: 600;

    letter-spacing: .6px;

    text-transform: uppercase;

    border-radius: 5px;

    transition: .3s;
    }

    .beneficios span:hover {

    background: #211f1b;

    color: var(--dorado-claro);
    }

    /* =========================================================
    SEPARADOR CATÁLOGO
    ========================================================= */

    #productos::before {

    content: "COLECCIÓN DESTACADA";

    grid-column: 1 / -1;

    display: block;

    text-align: left;

    color: var(--dorado);

    font-size: 12px;

    font-weight: 800;

    letter-spacing: 3px;

    padding-bottom: 5px;

    border-bottom: 1px solid rgba(201,164,92,.2);

    margin-bottom: 5px;
    }

    /* =========================================================
    CATÁLOGO
    ========================================================= */

    #productos {

    width: 100%;

    max-width: 1250px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:

    repeat(
      auto-fit,
      minmax(230px, 1fr)
    );


    gap: 28px;
    }

    /* =========================================================
    TARJETA
    ========================================================= */

    .producto {

    position: relative;

    display: flex;

    flex-direction: column;

    padding: 12px;

    overflow: hidden;

    background:

    linear-gradient(
      145deg,
      #211f1b,
      #11110f
    );


    border:

    1px solid
    rgba(255,255,255,.08);


    border-radius: 9px;

    box-shadow:

    0 20px 50px rgba(0,0,0,.45);


    transition:

    transform .45s cubic-bezier(.2,.8,.2,1),

    box-shadow .45s ease,

    border-color .45s ease;


    }

    /* brillo */

    .producto::after {

    content: "";

    position: absolute;

    width: 160px;

    height: 160px;

    top: -80px;

    right: -80px;

    background: var(--dorado);

    opacity: .035;

    border-radius: 50%;

    filter: blur(20px);

    pointer-events: none;
    }

    .producto:hover {

    transform:

    translateY(-12px)
    scale(1.01);


    border-color:

    rgba(201,164,92,.5);


    box-shadow:

    0 35px 70px rgba(0,0,0,.65),

    0 0 30px rgba(201,164,92,.07);


    }

    /* =========================================================
    IMAGEN / PORTADA
    ========================================================= */

    .producto img {

    width: 100%;

    aspect-ratio: 1 / 1;

    height: auto;

    object-fit: cover;

    display: block;

    border-radius: 4px;

    background: #050505;

    box-shadow:

    0 12px 25px rgba(0,0,0,.6);


    transition:

    transform .6s cubic-bezier(.2,.8,.2,1),

    filter .6s ease;


    }

    .producto:hover img {

    transform: scale(1.035);

    filter:

    brightness(1.08)
    contrast(1.04);


    }

    /* =========================================================
    LINEA DECORATIVA
    ========================================================= */

    .producto h3 {

    color: #f4eee2;

    font-size: 17px;

    line-height: 1.35;

    font-weight: 700;

    margin:

    18px 5px 8px;


    }

    /* =========================================================
    DESCRIPCIÓN
    ========================================================= */

    .descripcion {

    color: #8e897f;

    font-size: 13px;

    line-height: 1.6;

    min-height: 85px;

    margin: 0 5px 15px;
    }

    /* =========================================================
    PRECIO
    ========================================================= */

    .precio {

    margin:

    auto 5px 15px;


    color: var(--dorado-claro);

    font-size: 23px;

    font-weight: 800;

    letter-spacing: -.5px;
    }

    .precio::before {

    content: "PRECIO DEL VINILO";

    display: block;

    margin-bottom: 5px;

    color: #666158;

    font-size: 8px;

    letter-spacing: 2px;

    font-weight: 700;
    }

    /* =========================================================
    BOTÓN
    ========================================================= */

    .producto button {

    width: 100%;

    padding: 14px 16px;

    border: 1px solid var(--dorado);

    border-radius: 5px;

    background:

    linear-gradient(
      135deg,
      #d8b86b,
      #a9833d
    );


    color: #15130f;

    font-size: 12px;

    font-weight: 900;

    letter-spacing: 1px;

    text-transform: uppercase;

    cursor: pointer;

    box-shadow:

    0 7px 20px rgba(0,0,0,.3);


    transition: .3s;
    }

    .producto button:hover {

    background:

    linear-gradient(
      135deg,
      #f0d58b,
      #c19a4b
    );


    box-shadow:

    0 10px 30px
    rgba(201,164,92,.2);


    transform: translateY(-2px);
    }

    .producto button:active {

    transform: scale(.98);
    }

    /* =========================================================
    CARRITO
    ========================================================= */

    .carrito {

    position: relative;

    width: 100%;

    max-width: 850px;

    margin: 80px auto 0;

    padding: 35px;

    background:

    linear-gradient(
      145deg,
      #211f1b,
      #11110f
    );


    border:

    1px solid
    rgba(201,164,92,.2);


    border-radius: 10px;

    box-shadow:

    0 30px 80px rgba(0,0,0,.6);


    overflow: hidden;
    }

    /* línea dorada */

    .carrito::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    height: 2px;

    background:

    linear-gradient(
      90deg,
      transparent,
      var(--dorado),
      transparent
    );


    }

    /* disco decorativo */

    .carrito::after {

    content: "";

    position: absolute;

    right: -90px;

    top: -90px;

    width: 230px;

    height: 230px;

    border-radius: 50%;

    background:

    repeating-radial-gradient(
      circle,
      #090909 0px,
      #090909 3px,
      #151515 4px,
      #090909 6px
    );


    opacity: .45;

    box-shadow:

    inset 0 0 0 35px #0d0d0d,

    inset 0 0 0 37px #222;


    }

    /* =========================================================
    TITULO CARRITO
    ========================================================= */

    .carrito h2 {

    position: relative;

    z-index: 2;

    color: var(--crema);

    font-size: 25px;

    margin-bottom: 25px;

    padding-bottom: 18px;

    border-bottom:

    1px solid
    rgba(255,255,255,.08);


    }

    /* =========================================================
    LISTA
    ========================================================= */

    #lista-carrito {

    position: relative;

    z-index: 2;

    padding-left: 22px;

    color: #bcb5a8;
    }

    #lista-carrito li {

    padding: 12px 4px;

    margin-bottom: 4px;

    line-height: 1.5;

    border-bottom:

    1px solid
    rgba(255,255,255,.04);


    }

    /* =========================================================
    RESUMEN
    ========================================================= */

    .resumen {

    position: relative;

    z-index: 2;

    margin-top: 25px;

    padding-top: 20px;

    border-top:

    1px solid
    rgba(255,255,255,.08);


    color: #9d988e;
    }

    .resumen strong {

    color: #63a979;

    font-weight: 700;
    }

    /* =========================================================
    TOTAL
    ========================================================= */

    .total {

    margin-top: 15px;

    color: var(--crema);

    font-size: 25px;

    font-weight: 800;
    }

    #total {

    color: var(--dorado-claro);
    }

    /* =========================================================
    BOTONES CARRITO
    ========================================================= */

    .vaciar,
    .finalizar {

    position: relative;

    z-index: 5;

    border-radius: 5px;

    padding: 13px 20px;

    margin-top: 20px;

    font-size: 12px;

    font-weight: 800;

    letter-spacing: .5px;

    cursor: pointer;

    transition: .3s;
    }

    /* VACIAR */

    .vaciar {

    background: #261719;

    color: #c7797e;

    border:

    1px solid
    #633238;


    }

    .vaciar:hover {

    background: #70242d;

    color: white;

    transform: translateY(-2px);
    }

    /* FINALIZAR */

    .finalizar {

    margin-left: 8px;

    background:

    linear-gradient(
      135deg,
      #438f62,
      #286b45
    );


    border:

    1px solid
    #55a775;


    color: white;

    box-shadow:

    0 8px 20px
    rgba(0,0,0,.3);


    }

    .finalizar:hover {

    background:

    linear-gradient(
      135deg,
      #58ad78,
      #347e52
    );


    transform: translateY(-2px);

    box-shadow:

    0 10px 25px
    rgba(61,139,98,.2);


    }

    /* =========================================================
    SCROLLBAR
    ========================================================= */

    ::-webkit-scrollbar {

    width: 8px;
    }

    ::-webkit-scrollbar-track {

    background: #080808;
    }

    ::-webkit-scrollbar-thumb {

    background:

    linear-gradient(
      #8b6e39,
      #c8a45d,
      #8b6e39
    );


    border-radius: 20px;
    }

    /* =========================================================
    SELECCIÓN DE TEXTO
    ========================================================= */

    ::selection {

    background: var(--dorado);

    color: #111;
    }

    /* =========================================================
    TABLET
    ========================================================= */

    @media (max-width: 900px) {

    body {

    padding-left: 18px;

    padding-right: 18px;


    }

    #productos {

    grid-template-columns:
      repeat(2, minmax(220px, 1fr));


    }

    .producto img {

    aspect-ratio: 1 / 1;


    }
    }

    /* =========================================================
    CELULAR
    ========================================================= */

    @media (max-width: 600px) {

    body {

    padding:

      0 12px 45px;


    }

    h1 {

    padding-top: 50px;

    font-size: 31px;

    letter-spacing: -1px;


    }

    .slogan {

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 28px;


    }

    .beneficios {

    margin-bottom: 40px;

    border-radius: 6px;


    }

    .beneficios span {

    min-width: 100%;

    padding: 12px;

    font-size: 11px;


    }

    #productos {

    grid-template-columns: 1fr;

    gap: 20px;


    }

    .producto {

    width: 100%;

    max-width: 390px;

    margin: auto;


    }

    .producto img {

    aspect-ratio: 1 / 1;


    }

    .producto h3 {

    font-size: 18px;


    }

    .descripcion {

    min-height: auto;


    }

    .carrito {

    margin-top: 55px;

    padding: 25px 18px;


    }

    .carrito h2 {

    font-size: 21px;


    }

    .vaciar,
    .finalizar {

    width: 100%;

    margin-left: 0;

    margin-top: 10px;


    }
    }

    /* =========================================================
    CELULARES PEQUEÑOS
    ========================================================= */

    @media (max-width: 380px) {

    h1 {

    font-size: 27px;


    }

    .producto img {

    aspect-ratio: 1 / 1;


    }

    .precio {

    font-size: 21px;


    }
    }
  </style>
</head>
<body>
  <h1>🎵 Vinilo Store </h1> <p class="slogan"> Música que se siente, vinilos que perduran 🎶 </p> <div class="beneficios"> <span>🚚 Envíos en Bogotá</span> <span>🔒 Compra segura</span> <span>💿 Vinilos originales</span> <span>📦 Seguimiento de pedido</span> </div> <div id="productos"></div> <div class="carrito"> <h2>🛒 Carrito de Vinilos</h2> <ul id="lista-carrito"></ul> <div class="resumen"> <p> Envío: <strong>Gratis</strong> </p>
  <p class="total">
    Total: $<span id="total">0</span>
  </p>

  </div> <button class="vaciar" onclick="vaciarCarrito()"> 🗑️ Vaciar carrito </button> <button class="finalizar" onclick="finalizarCompra()"> 💳 Finalizar compra </button> </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "CHROMAKOPIA 2LP - Tyler the creator",
        descripcion: "CHROMAKOPIA es el octavo álbum de estudio de Tyler, the Creator, publicado el 28 de octubre de 2024. Ahora disponible en vinilo, incluyendo todas las canciones del álbum original",
        precio: 115299,
    	imagen:"https://store.sonymusic.es/cdn/shop/files/chromakopia_1.png?v=1760698536&width=1600"
      },
      {
        id: 2,
        nombre: "El madrileño - C tangana",
        descripcion: "En este esperadísimo disco que ha ido anunciando su llegada con #1, records de streamings (todos los singles previos también están aquí, incluido “Nunca Estoy”, punto de inflexión previo a esta nueva etapa)",
        precio: 58000,
      imagen:"https://store.sonymusic.es/cdn/shop/files/elmadrilenocd.png?v=1779897919&width=1600"
      },
      {
        id: 3,
        nombre: "Astroworld - Travis Scott",
        descripcion: "En este esperadísimo disco que ha ido anunciando su llegada con #1, records de streamings (todos los singles previos también están aquí, incluido “Nunca Estoy”, punto de inflexión previo a esta nueva etapa",
        precio: 100886,
        imagen: "https://store.sonymusic.es/cdn/shop/files/Utopia.webp?v=1790768041&width=1600"
      },
      {
        id: 4,
        nombre: "Cosa Nuestra: Capitulo 0 - Rauw Alejandro",
        descripcion: "Cosa Nuestra: Capítulo 0 es el sexto álbum de estudio de Rauw Alejandro y funciona como una precuela de Cosa Nuestra (2024). En este proyecto, lanzado el 26 de septiembre de 2025, el artista explora profundamente sus raíces caribeñas y su identidad puertorriqueña, fusionando ritmos tradicionales como bomba, plena, salsa y bachata con elementos modernos.",
        precio: 187361,
        imagen: "https://store.sonymusic.es/cdn/shop/files/rauw_1_5aa6d160-5323-490a-9c93-5027e7186c63.png?v=1778164137&width=1600"
      },
      {
        id: 5,
        nombre: "Random Access Memories 2LPs - Daft Punk",
        descripcion: "Cuarto álbum de estudio. Incluye colaboraciones con Pharrell Williams, Julian Casablancas, Panda Bear, Nile Rodgers, Todd Edwards y Giorgio Moroder. Publicado originalmente el 17 de mayo de 2013.",
        precio: 100886,
        imagen: "https://store.sonymusic.es/cdn/shop/files/daftpunk_1.png?v=1769771203&width=1600"
      }
    ];


    /* ==============================
       CARRITO
    ================================ */

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");


    /* ==============================
       MOSTRAR PRODUCTOS
    ================================ */

    function mostrarProductos() {

      contenedorProductos.innerHTML = "";

      productos.forEach(prod => {

        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">

          <h3>${prod.nombre}</h3>

          <p class="descripcion">
            ${prod.descripcion}
          </p>

          <p class="precio">
            ${prod.precio.toLocaleString("es-CO", {
              style: "currency",
              currency: "COP",
              minimumFractionDigits: 0
            })}
          </p>

          <button onclick="agregarAlCarrito(${prod.id})">
            Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);

      });

    }


    /* ==============================
       AGREGAR AL CARRITO
    ================================ */

    function agregarAlCarrito(id) {

      const productoExistente =
        carrito.find(p => p.id === id);

      if (productoExistente) {

        productoExistente.cantidad++;

      } else {

        const producto =
          productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });

      }

      actualizarCarrito();

    }


    /* ==============================
       ACTUALIZAR CARRITO
    ================================ */

    function actualizarCarrito() {

      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {

        const li =
          document.createElement("li");

        const subtotal =
          item.precio * item.cantidad;

        li.textContent =
          `${item.nombre} x${item.cantidad} — ` +
          subtotal.toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            minimumFractionDigits: 0
          });

        listaCarrito.appendChild(li);

        total += subtotal;
        totalItems += item.cantidad;

      });

      totalCarrito.textContent =
        total.toLocaleString("es-CO");

      actualizarTituloCarrito(totalItems);

    }


    /* ==============================
       CONTADOR DEL CARRITO
    ================================ */

    function actualizarTituloCarrito(cantidad) {

      const titulo =
        document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;

    }


    /* ==============================
       VACIAR CARRITO
    ================================ */

    function vaciarCarrito() {

      if (carrito.length === 0) {

        alert("🛒 El carrito ya está vacío.");

        return;

      }

      if (
        confirm(
          "¿Estás seguro de que quieres vaciar el carrito?"
        )
      ) {

        carrito.length = 0;

        actualizarCarrito();

      }

    }


    /* ==============================
       FINALIZAR COMPRA
    ================================ */

    function finalizarCompra() {

      if (carrito.length === 0) {

        alert(
          "🛒 Tu carrito está vacío. Agrega productos antes de finalizar la compra."
        );

        return;

      }

      alert(
        "🎉 ¡Pedido simulado confirmado!\n\n" +
        "En un eCommerce real, ahora entrarían en acción " +
        "el backend, la pasarela de pago y la logística."
      );

      carrito.length = 0;

      actualizarCarrito();

    }


    /* ==============================
       INICIAR TIENDA
    ================================ */

    mostrarProductos();
  </script>
</body>
</html>
